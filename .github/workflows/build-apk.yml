name: Build APK Tahfidz 28-30

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # dibutuhkan untuk menerbitkan Release saat memberi tag vX.Y.Z

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Pasang dependensi
        run: npm ci

      - name: Siapkan aplikasi web (tanpa CDN) & sinkronkan ke Android
        run: |
          npm run sync
          node scripts/patch-android.js

      - name: Siapkan kunci penandatanganan (opsional)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Keystore ditemukan: APK rilis akan ditandatangani."
          else
            echo "Keystore tidak ada: hanya APK debug yang dibuat."
          fi

      - name: Build APK debug (selalu dapat dipasang)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build APK + AAB rilis bertanda tangan (jika keystore ada)
        if: env.KEYSTORE_FILE != ''
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Kumpulkan hasil
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Tahfidz-28-30-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/Tahfidz-28-30.apk
            cp android/app/build/outputs/bundle/release/app-release.aab dist/Tahfidz-28-30.aab
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Tahfidz-28-30-APK
          path: dist/*
          if-no-files-found: error

      - name: Terbitkan GitHub Release (saat tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
